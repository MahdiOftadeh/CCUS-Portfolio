name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Suite tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project_01_vpsa_zeolite13x/vpsa_simulation_suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: project_01_vpsa_zeolite13x/vpsa_simulation_suite/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run suite tests
        run: python -m pytest tests/ -v --tb=short